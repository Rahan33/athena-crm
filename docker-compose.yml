services:
  # ==========================================
  # BACKEND SERVICE (Cloud Native API & WebSockets)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athena-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - JWT_SECRET=athena-enterprise-super-secure-production-jwt-token-2026
      - DATABASE_URL=file:./dev.db
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend-data:/app/prisma
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - athena-network

  # ==========================================
  # FRONTEND SERVICE (Nginx Reverse Proxy & SPA)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - athena-network

  # ==========================================
  # REDIS CACHE & DISTRIBUTED RATE LIMITER
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: athena-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - athena-network

volumes:
  backend-data:
    name: athena-backend-data
  backend-uploads:
    name: athena-backend-uploads
  redis-data:
    name: athena-redis-data

networks:
  athena-network:
    name: athena-enterprise-network
    driver: bridge
